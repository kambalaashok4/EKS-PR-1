name: UI Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/ui/**'
      - 'charts/ui/**'
      - '.github/workflows/ui.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/ui/**'

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

env:
  SERVICE_NAME: ui
  ECR_REPOSITORY: retail-store-ui
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    name: Test UI Service (Java/Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: make maven wrapper executable
        run: chmod +x ./mvnw
      - name: Run Maven Build & Tests
        run: ./mvnw clean test

  build-and-deploy:
    name: Build, Push ECR & Deploy EKS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq .
        
      - name: debug jwt
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: src/ui
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # - name: Update Kubeconfig for EKS
      #   run: |
      #     aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      # - name: Deploy using Helm (from repo charts/ui)
      #   run: |
      #     helm upgrade --install ui ./charts/ui \
      #       --namespace ${{ vars.K8S_NAMESPACE }} \
      #       --create-namespace \
      #       --set image.repository=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }} \
      #       --set image.tag=${{ github.sha }} \
      #       --wait --timeout 3m


      