name: CI/CD — Build, Containerize, Deploy with ArgoCD

# Requires these repository secrets:
# - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
# - ECR_REGISTRY (e.g. 123456789012.dkr.ecr.us-west-2.amazonaws.com)
# - ECR_REPOSITORY (e.g. my-node-app)
# - ARGOCD_SERVER, ARGOCD_USERNAME, ARGOCD_PASSWORD, ARGOCD_APP_NAME (optional, to trigger sync)
# - GITHUB_TOKEN is provided automatically by Actions for pushing commits

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push manifest updates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build --if-present

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image to ECR
        id: build_and_push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Prepare image reference
        run: |
          echo "IMAGE_FULL=${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Update Kubernetes deployment image (manifests/deployment.yaml)
        # This step assumes you have a k8s deployment in manifests/deployment.yaml with an `image:` field.
        # If you use kustomize/Helm, adapt this step to patch the right resource (kustomize edit set image or helm upgrade with --set image.tag=...)
        run: |
          DEPLOYMENT_FILE=manifests/deployment.yaml
          if [ ! -f "$DEPLOYMENT_FILE" ]; then
            echo "Error: $DEPLOYMENT_FILE not found. Create a manifest at $DEPLOYMENT_FILE or adapt the workflow." >&2
            exit 1
          fi
          IMAGE="$IMAGE_FULL"
          # Replace the image value in the file. This is a simple approach — adjust the sed command for your manifest layout.
          # It will replace the first occurrence of `image:` with `image: <value>` on that line.
          sed -E -i "s|(^\s*image:\s*).*$|\1${IMAGE}|" "$DEPLOYMENT_FILE"
          git status --porcelain

      - name: Commit and push manifest change
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add -A
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "ci: update k8s image to $IMAGE_FULL" || true
            git push origin HEAD:main
          fi

      - name: Install ArgoCD CLI (optional)
        if: ${{ secrets.ARGOCD_SERVER && secrets.ARGOCD_USERNAME && secrets.ARGOCD_PASSWORD }}
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Trigger ArgoCD sync (optional)
        if: ${{ secrets.ARGOCD_SERVER && secrets.ARGOCD_USERNAME && secrets.ARGOCD_PASSWORD && secrets.ARGOCD_APP_NAME }}
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_USERNAME: ${{ secrets.ARGOCD_USERNAME }}
          ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
          ARGOCD_APP_NAME: ${{ secrets.ARGOCD_APP_NAME }}
        run: |
          # login (insecure option used when ArgoCD uses self-signed certs; remove --insecure if you have a valid cert)
          argocd login $ARGOCD_SERVER --username $ARGOCD_USERNAME --password $ARGOCD_PASSWORD --insecure
          # sync the app that points to this repo/path
          argocd app sync $ARGOCD_APP_NAME --prune --retry

      - name: Done
        run: echo "Workflow finished. Image pushed: $IMAGE_FULL. If ArgoCD credentials were provided the app was synced."
