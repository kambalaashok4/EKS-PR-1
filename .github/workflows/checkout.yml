name: Checkout Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/checkout/**'
      - '.github/workflows/checkout.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/checkout/**'

permissions:
  id-token: write
  contents: read

env:
  SERVICE_NAME: checkout
  SERVICE_DIR: src/checkout
  ECR_REPOSITORY: checkout/retail-store-checkout
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    name: Test Checkout Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/checkout
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/checkout/package.json

      - name: Install & Run Unit Tests
        run: |
          npm install
          npm run test --if-present

  build-and-deploy:
    name: Build, Push ECR & Deploy EKS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq .
        
      - name: debug jwt
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: src/checkout
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

    #   - name: Update Kubeconfig for EKS
    #     run: |
    #       aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

    #   - name: Deploy to Amazon EKS
    #     run: |
    #       kubectl set image deployment/checkout \
    #         checkout=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
    #         -n ${{ vars.K8S_NAMESPACE }}
    #       kubectl rollout status deployment/checkout -n ${{ vars.K8S_NAMESPACE }} --timeout=180s