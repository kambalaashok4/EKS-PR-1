name: Catalog Service CI/CD with SAST & DAST (No Helm)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/catalog/**'
      - 'deploy/kubernetes/catalog.yaml'
      - '.github/workflows/catalog-ci-cd.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/catalog/**'

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  SERVICE_NAME: catalog
  SERVICE_DIR: src/catalog
  ECR_REPOSITORY: retail-store-catalog

jobs:
  # =========================================================================
  # 1. CODE TEST & SAST (Go Test & SonarQube)
  # =========================================================================
  test-and-sast:
    name: 1. Code Test & SAST (SonarQube)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/catalog
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: src/catalog/go.sum

      - name: Run Go Unit Tests & Coverage
        run: |
          go vet ./...
          go test -v ./... -coverprofile=coverage.out

      # SonarQube Scanner for Go (runs only when secret is configured)
      - name: SonarQube SAST Scan
        if: env.SONAR_TOKEN != ''
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: src/catalog
          args: >
            -Dsonar.projectKey=retail-store-catalog
            -Dsonar.projectName="Retail Store Catalog"
            -Dsonar.go.coverage.reportPaths=coverage.out

  # =========================================================================
  # 2. CONTAINER BUILD, TRIVY SCAN & ECR PUSH
  # =========================================================================
  build-scan-and-push:
    name: 2. Container Build, Trivy Scan & ECR Push
    needs: test-and-sast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Trivy Scan
        uses: docker/build-push-action@v5
        with:
          context: src/catalog
          load: true
          tags: local-catalog:${{ github.sha }}
          cache-from: type=gha

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local-catalog:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Configure AWS Credentials (OIDC)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Image to ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: src/catalog
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

