name: Orders Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/orders/**'
      - '.github/workflows/orders.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/orders/**'

permissions:
  id-token: write
  contents: read

env:
  SERVICE_NAME: orders
  SERVICE_DIR: src/orders
  ECR_REPOSITORY: orders/retail-store-orders

jobs:
  test:
    name: Test Orders (Java/Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/orders
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: make maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run Maven Tests
        run: ./mvnw clean test
    
      - name: Run SonarQube SAST Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        if: env.SONAR_TOKEN != ''
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=RetailStoreOrders \
            -Dsonar.projectName="RetailStoreOrders"

  build-and-deploy:
    name: Build,  Push ECR ,TRIVY Scan
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Trivy Scan
        uses: docker/build-push-action@v5
        with:
          context: src/orders
          load: true
          tags: local-orders:${{ github.sha }}
          cache-from: type=gha

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local-orders:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'


      - name: Debug OIDC token claims
        run: |
          curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq .
        
      - name: debug jwt
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: src/orders
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

    #   - name: Update Kubeconfig for EKS
    #     run: |
    #       aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

    #   - name: Deploy to Amazon EKS
    #     run: |
    #       kubectl set image deployment/orders \
    #         orders=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
    #         -n ${{ vars.K8S_NAMESPACE }}
    #       kubectl rollout status deployment/orders -n ${{ vars.K8S_NAMESPACE }} --timeout=180s